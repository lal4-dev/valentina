<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Delicate Floral V Favicon for Valentina - Transparent background -->
  <defs>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Letter V -->
  <path
    d="M 12 12 L 23 12 L 32 44 L 41 12 L 52 12 L 37 54 C 35 59 29 59 27 54 Z"
    fill="url(#vGrad)"
  />

  <!-- Flower 1: Top Left Blossom -->
  <g transform="translate(14, 14)">
    <circle cx="0" cy="-5" r="4" fill="#F472B6" opacity="0.95"/>
    <circle cx="5" cy="-2" r="4" fill="#F9A8D4" opacity="0.95"/>
    <circle cx="3" cy="4" r="4" fill="#F472B6" opacity="0.95"/>
    <circle cx="-3" cy="4" r="4" fill="#F9A8D4" opacity="0.95"/>
    <circle cx="-5" cy="-2" r="4" fill="#F472B6" opacity="0.95"/>
    <circle cx="0" cy="0" r="2.5" fill="#FDE047"/>
  </g>

  <!-- Flower 2: Center Right Branch Blossom -->
  <g transform="translate(42, 28)">
    <circle cx="0" cy="-4" r="3.5" fill="#FB7185" opacity="0.95"/>
    <circle cx="4" cy="-1" r="3.5" fill="#FDA4AF" opacity="0.95"/>
    <circle cx="2" cy="3" r="3.5" fill="#FB7185" opacity="0.95"/>
    <circle cx="-2" cy="3" r="3.5" fill="#FDA4AF" opacity="0.95"/>
    <circle cx="-4" cy="-1" r="3.5" fill="#FB7185" opacity="0.95"/>
    <circle cx="0" cy="0" r="2" fill="#FEF08A"/>
  </g>

  <!-- Little green leaves -->
  <path d="M 8 18 Q 4 15 6 11 Q 10 12 8 18 Z" fill="#86EFAC"/>
  <path d="M 46 22 Q 51 20 50 16 Q 45 18 46 22 Z" fill="#86EFAC"/>
  <path d="M 22 22 Q 26 25 24 28 Q 20 27 22 22 Z" fill="#6EE7B7"/>

  <!-- Flower 3: Tiny Bottom Accent Blossom -->
  <g transform="translate(32, 53)">
    <circle cx="-3" cy="0" r="2.5" fill="#F472B6"/>
    <circle cx="3" cy="0" r="2.5" fill="#F472B6"/>
    <circle cx="0" cy="-3" r="2.5" fill="#F9A8D4"/>
    <circle cx="0" cy="0" r="1.5" fill="#FDE047"/>
  </g>
</svg>
